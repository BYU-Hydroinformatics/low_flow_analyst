services:
  - type: web
    name: low-flow-analyst
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free              # 512 MB. See the memory note in the README's deployment section.
    region: oregon
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Optional: directory holding random_forest_bfd_model.joblib and
      # feature_scaler.joblib. Leave unset to disable the BFD-ML routes.
      # - key: BFD_MODEL_DIR
      #   value: /app/ml_model
      # Required for the rivers-only basemap: without it, CARTO serves tiles
      # watermarked "API KEY REQUIRED". Set as a secret in the Render dashboard
      # rather than committing it here.
      - key: CARTO_API_KEY
        sync: false
